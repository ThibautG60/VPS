x-php-base: &php-base
  image: atom_apache_php_pdo_mailer
  build:
    context: .
    dockerfile: dockerfile
  volumes:
    - ./code:/var/www/html/
  environment:
    - SMTP_HOST=${SMTP_HOST}
    - SMTP_PORT=${SMTP_PORT}
    - SMTP_USER=${SMTP_USER}
    - SMTP_PASSWORD=${SMTP_PASSWORD}
  depends_on:
    composer:
      condition: service_completed_successfully

services:
  php-local:
    <<: *php-base
    container_name: tg_apache_local
    profiles: ["local"]
    ports:
      - "81:80"

  php-prod:
    <<: *php-base
    container_name: tg_apache
    profiles: ["prod"]
    networks:
      - atom-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tg.rule=Host(`thibaut-gerard.fr`) || Host(`www.thibaut-gerard.fr`)"
      - "traefik.http.routers.tg.entrypoints=websecure"
      - "traefik.http.routers.tg.tls.certresolver=atom"
      # Middleware HSTS
      - "traefik.http.routers.tg.middlewares=redirect-www@docker,hsts@docker"

  # Installation ponctuelle des dépendances PHP (Composer) avant le démarrage d'Apache
  composer:
    image: public.ecr.aws/docker/library/composer:2
    user: "${PA_UID:-1000}:${PA_GID:-1000}"
    working_dir: /var/www/html
    environment:
      - COMPOSER_HOME=/tmp/composer
    volumes:
      - ./code:/var/www/html
    # Prod : COMPOSER_FLAGS="--no-dev --optimize-autoloader" dans le .env
    command: install --no-interaction --prefer-dist ${COMPOSER_FLAGS:-}

networks:
  atom-network:
    external: true
